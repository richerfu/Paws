[package]
edition = "2021"
rust-version = "1.89"
name = "meow-config"
version = "0.22.0"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "YAML configuration parsing for the meow-rs proxy kernel."
homepage = "https://meow-rs.github.io/meow-rs/"
readme = false
license = "MIT"
repository = "https://github.com/meow-rs/meow-rs"

[features]
anytls = ["meow-proxy/anytls"]
boring-tls = []
default = [
    "ss",
    "trojan",
    "vless",
    "vless-vision",
    "vless-encryption",
    "ech-tls-tunnel",
    "vmess",
    "snell",
    "hysteria2",
    "mux",
    "kcptun",
]
ech-tls-tunnel = [
    "ss",
    "meow-proxy/ech-tls-tunnel",
]
external-ui-download = ["dep:zip"]
hysteria2 = ["meow-proxy/hysteria2"]
kcptun = [
    "ss",
    "mux",
    "meow-proxy/kcptun",
]
mux = ["meow-proxy/mux"]
snell = [
    "meow-proxy/snell",
    "meow-transport/simple-obfs",
]
ss = ["meow-proxy/ss"]
trojan = ["meow-proxy/trojan"]
vless = [
    "meow-proxy/vless",
    "meow-transport/reality",
]
vless-encryption = [
    "vless",
    "meow-proxy/vless-encryption",
]
vless-vision = [
    "vless",
    "meow-proxy/vless-vision",
]
vmess = ["meow-proxy/vmess"]

[lib]
name = "meow_config"
path = "src/lib.rs"

[[test]]
name = "config_persistence_test"
path = "tests/config_persistence_test.rs"

[[test]]
name = "config_test"
path = "tests/config_test.rs"

[[test]]
name = "dialer_proxy_group"
path = "tests/dialer_proxy_group.rs"

[[test]]
name = "ech_dns_test"
path = "tests/ech_dns_test.rs"

[[test]]
name = "internal_http_via_ss"
path = "tests/internal_http_via_ss.rs"

[[test]]
name = "sniffer_config_test"
path = "tests/sniffer_config_test.rs"

[[test]]
name = "tun_config_test"
path = "tests/tun_config_test.rs"

[[test]]
name = "vless_config_test"
path = "tests/vless_config_test.rs"

[dependencies.anyhow]
version = "1"

[dependencies.async-trait]
version = "0.1"

[dependencies.base64]
version = "0.22"

[dependencies.dashmap]
version = "6"

[dependencies.hickory-proto]
version = "0.26"

[dependencies.httparse]
version = "1"

[dependencies.ipnet]
version = "2"

[dependencies.maxminddb]
version = "0.27"
features = ["mmap"]

[dependencies.meow-common]
version = "0.22.0"

[dependencies.meow-dns]
version = "0.22.0"
features = ["encrypted"]
default-features = false

[dependencies.meow-proxy]
version = "0.22.0"
default-features = false

[dependencies.meow-rules]
version = "0.22.0"

[dependencies.meow-transport]
version = "0.22.0"
features = [
    "tls",
    "ws",
    "grpc",
    "h2",
    "httpupgrade",
    "xhttp",
]
default-features = false

[dependencies.meow-trie]
version = "0.22.0"

[dependencies.parking_lot]
version = "0.12"

[dependencies.regex]
version = "1"

[dependencies.serde]
version = "1"
features = [
    "derive",
    "rc",
]

[dependencies.serde_yaml]
version = "0.9"

[dependencies.smol_str]
version = "0.3"
features = ["serde"]

[dependencies.tokio]
version = "1"
features = ["full"]

[dependencies.tracing]
version = "0.1"

[dependencies.url]
version = "2"

[dependencies.zip]
version = "2"
features = ["deflate"]
optional = true
default-features = false

[dev-dependencies.tempfile]
version = "3"

[dev-dependencies.tokio]
version = "1"
