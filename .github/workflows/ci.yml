name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust fmt and tests
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Prepare Cargo dependencies
        run: scripts/prepare-ci-cargo.sh

      - name: Check formatting
        run: cargo fmt --check

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Verify local protocol profiles
        run: scripts/verify-local-protocols.sh

  harmony:
    name: HarmonyOS aarch build
    runs-on: [self-hosted, macOS, harmonyos]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Cargo dependencies
        run: scripts/prepare-ci-cargo.sh

      - name: Build debug HAP
        run: ohrs build --arch aarch

      - name: Upload HAP artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hmeta-debug-hap
          if-no-files-found: warn
          path: |
            entry/build/**/*.hap
            build/**/*.hap
