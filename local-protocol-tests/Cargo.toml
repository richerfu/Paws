[package]
name = "paws-local-protocol-tests"
version = "1.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
hex = "0.4"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde_yaml = "0.9"
sha2 = "0.10"
shadowsocks = { version = "1.24", default-features = false, features = ["aead-cipher"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
