[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "1.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.89"

[workspace.dependencies]
paws_model = { path = "crates/paws_model" }
paws_profile = { path = "crates/paws_profile" }
paws_core = { path = "crates/paws_core" }
paws_vpn = { path = "crates/paws_vpn" }

# arkit mainline; declarative `#[entry(plugins = [...])]` bridge-plugin
# registration (no hand-written init/render needed).
arkit = { git = "https://github.com/richerfu/arkit.git", rev = "ca4918e235ed6e84726ddda582c157c5fb568932", features = ["router", "shadcn", "barcode"] }
ohos-ashmem-binding = "0.1.0"

# Pluginized platform capabilities from openharmony-ability. These published
# plugin releases resolve to the openharmony-ability version selected by Arkit.
openharmony-ability-plugin-files = "1.0.0-beta.1"
openharmony-ability-plugin-url = "1.0.0-beta.1"

meow-api = "0.21.2"
meow-common = "0.21.2"
meow-config = { version = "0.21.2", features = ["anytls", "boring-tls"] }
meow-dns = "0.21.2"
meow-listener = "0.21.2"
meow-proxy = { version = "0.21.2", features = ["anytls"] }
meow-trie = "0.21.2"
meow-tunnel = "0.21.2"

anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
dashmap = "6"
dioxus = { version = "0.7.10", default-features = false, features = ["signals", "hooks", "macro"] }
futures = "0.3"
getrandom = "0.2"
ipnet = "2"
libc = "0.2"
lwip = { package = "meow-lwip", version = "0.21.2" }
netstack-smoltcp = "0.2"
napi-build-ohos = "1.2.0"
napi-derive-ohos = "1.2.0"
napi-ohos = { version = "1.2.0", features = ["napi8", "tokio_rt"] }
once_cell = "1"
parking_lot = "0.12"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "cookies", "gzip", "brotli", "json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
shadowsocks = { version = "1.24", default-features = false, features = ["aead-cipher"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake"] }
tracing = "0.1"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3"
url = "2"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[workspace.lints.rust]
unused_must_use = "warn"

[patch.crates-io]
# Arkit's PC input support depends on unreleased ArkUI event wrappers. Cargo
# only honors patches from the consuming workspace, so keep Paws on the exact
# binding revision used by the pinned Arkit commit.
ohos-arkui-binding = { git = "https://github.com/ohos-rs/ohos-native-bindings.git", rev = "b278b62617c27065b518541d2941d4bac6996928" }
ohos-drawing-binding = { git = "https://github.com/ohos-rs/ohos-native-bindings.git", rev = "b278b62617c27065b518541d2941d4bac6996928" }
ohos-xcomponent-binding = { git = "https://github.com/ohos-rs/ohos-native-bindings.git", rev = "b278b62617c27065b518541d2941d4bac6996928" }
ohos-xcomponent-sys = { git = "https://github.com/ohos-rs/ohos-native-bindings.git", rev = "b278b62617c27065b518541d2941d4bac6996928" }
