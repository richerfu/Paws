[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
rust-version = "1.89"

[workspace.dependencies]
hmeta_model = { path = "crates/hmeta_model" }
hmeta_profile = { path = "crates/hmeta_profile" }
hmeta_core = { path = "crates/hmeta_core" }
hmeta_vpn = { path = "crates/hmeta_vpn" }

# Latest arkit main; this revision pins openharmony-ability to its latest
# upstream Git revision as well.
arkit = { git = "https://github.com/richerfu/arkit.git", rev = "e8e0be16ff22add530d3fd3edebe9f94aa392094", features = ["router", "shadcn"] }
ohos-ashmem-binding = "0.1.0"

# Pluginized platform capabilities from openharmony-ability. The source
# revision must match the one arkit pins (see the openharmony-ability entry in
# Cargo.lock), otherwise the BridgePlugin types would not be identical.
openharmony-ability-plugin-files = { git = "https://github.com/harmony-contrib/openharmony-activity.git", rev = "77548ad83570101d85085ab55ddd9b5d549c8705" }
openharmony-ability-plugin-url = { git = "https://github.com/harmony-contrib/openharmony-activity.git", rev = "77548ad83570101d85085ab55ddd9b5d549c8705" }

meow-api = "0.19.0"
meow-common = "0.19.0"
meow-config = { version = "0.19.0", features = ["anytls"] }
meow-dns = "0.19.0"
meow-listener = "0.19.0"
meow-proxy = { version = "0.19.0", features = ["anytls"] }
meow-trie = "0.19.0"
meow-tunnel = "0.19.0"

anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
dashmap = "6"
dioxus = { version = "0.7", default-features = false, features = ["signals", "hooks", "macro"] }
futures = "0.3"
ipnet = "2"
libc = "0.2"
lwip = "0.3.15"
netstack-smoltcp = "0.2"
napi-build-ohos = "1.1"
napi-derive-ohos = "1.1"
napi-ohos = { version = "1.1", features = ["napi8", "tokio_rt"] }
once_cell = "1"
parking_lot = "0.12"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
shadowsocks = { version = "1.24", default-features = false, features = ["aead-cipher"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake"] }
tracing = "0.1"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3"
tun-rs = { version = "2", features = ["async_tokio"] }
url = "2"

# The released lwip 0.3.15 wrappers can race with C callbacks on a
# multi-thread runtime and leak half-closed TCP PCBs. This pinned upstream
# revision contains the synchronization and close fixes already exercised by
# Meow's Android/iOS tun2socks implementations.
[patch.crates-io]
lwip = { git = "https://github.com/madeye/lwip", rev = "dab00c540cf0606fee14ddd99cfa6ec79d33681d" }

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[workspace.lints.rust]
unused_must_use = "warn"
