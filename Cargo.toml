[workspace]
members = ["crates/*", "vendor/meow-tunnel", "vendor/meow-common"]
exclude = ["vendor/meow-proxy", "vendor/meow-anytls", "vendor/meow-listener", "vendor/meow-transport"]
resolver = "2"

[workspace.package]
version = "1.2.0"
edition = "2021"
license = "MIT"
rust-version = "1.90"

# Keep debug HAPs debuggable without running the proxy kernel and TLS at -O0.
[profile.dev]
opt-level = 1
debug = 1

[profile.dev.package."*"]
opt-level = 3

[workspace.dependencies]
paws_model = { path = "crates/paws_model" }
paws_profile = { path = "crates/paws_profile" }
paws_core = { path = "crates/paws_core" }
paws_vpn = { path = "crates/paws_vpn" }

# Use published releases for the native UI and its matching Ability bridge.
arkit = { version = "=0.0.1-beta.0", features = ["router", "shadcn", "barcode"] }
ohos-ashmem-binding = "0.1.0"
ohos-hilog-binding = "0.2.3"
ohos-fileuri-binding = "0.2.4"
ohos-fileshare-binding = "0.2.4"
ohos-resource-manager-binding = "0.3.4"

openharmony-ability-plugin-files = "=1.0.0-beta.3"
openharmony-ability-plugin-url = "=1.0.0-beta.3"

meow-api = "=0.22.0"
meow-common = "=0.22.0"
meow-config = { version = "=0.22.0", features = ["anytls", "boring-tls"] }
meow-dns = "=0.22.0"
meow-listener = "=0.22.0"
meow-proxy = { version = "=0.22.0", features = ["anytls"] }
meow-trie = "=0.22.0"
meow-transport = { version = "=0.22.0", default-features = false, features = ["simple-obfs"] }
meow-tunnel = "=0.22.0"

anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
dashmap = "6"
dioxus = { version = "0.7.10", default-features = false, features = ["signals", "hooks", "macro"] }
futures = "0.3"
getrandom = "0.2"
ipnet = "2"
libc = "0.2"
lwip = { package = "meow-lwip", version = "=0.22.0" }
netstack-smoltcp = "0.2"
napi-build-ohos = "1.2.0"
napi-derive-ohos = "1.2.0"
napi-ohos = { version = "1.2.0", features = ["napi8", "tokio_rt"] }
once_cell = "1"
parking_lot = "0.12"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "cookies", "gzip", "brotli", "json", "multipart", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
serde_yaml = "0.9"
shadowsocks = { version = "1.24", default-features = false, features = ["aead-cipher"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time", "net", "fs", "io-util"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake"] }
toml = "0.9"
tracing = "0.1"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3"
url = "2"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[workspace.lints.rust]
unused_must_use = "warn"

[patch.crates-io]
meow-listener = { path = "vendor/meow-listener" }
meow-common = { path = "vendor/meow-common" }
meow-anytls = { path = "vendor/meow-anytls" }
meow-proxy = { path = "vendor/meow-proxy" }
meow-tunnel = { path = "vendor/meow-tunnel" }
meow-transport = { path = "vendor/meow-transport" }
