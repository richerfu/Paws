[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.89"

[workspace.dependencies]
hmeta_model = { path = "crates/hmeta_model" }
hmeta_profile = { path = "crates/hmeta_profile" }
hmeta_core = { path = "crates/hmeta_core" }
hmeta_vpn = { path = "crates/hmeta_vpn" }

arkit = { path = "../../ohos-rs/arkit/crates/arkit", package = "arkit", features = ["router", "shadcn"] }

meow-api = "0.17.0"
meow-common = "0.17.0"
meow-config = { version = "0.17.0", features = ["anytls"] }
meow-dns = "0.17.0"
meow-listener = "0.17.0"
meow-proxy = { version = "0.17.0", features = ["anytls"] }
meow-trie = "0.17.0"
meow-tunnel = "0.17.0"

anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
dashmap = "6"
dioxus = { version = "0.7", default-features = false, features = ["signals", "hooks", "macro"] }
futures = "0.3"
libc = "0.2"
netstack-smoltcp = "0.2"
napi-build-ohos = "1.1"
napi-derive-ohos = "1.1"
napi-ohos = { version = "1.1", features = ["napi8", "tokio_rt"] }
once_cell = "1"
parking_lot = "0.12"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
shadowsocks = { version = "1.24", default-features = false, features = ["aead-cipher"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tun-rs = { version = "2", features = ["async_tokio"] }
url = "2"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[workspace.lints.rust]
unused_must_use = "warn"
