[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "1.3.0"
edition = "2021"
license = "MIT"
rust-version = "1.90"

# Keep debug HAPs debuggable without running the proxy kernel and TLS at -O0.
[profile.dev]
opt-level = 1
debug = 1

[profile.dev.package."*"]
opt-level = 3

[workspace.dependencies]
paws_model = { path = "crates/paws_model" }
paws_profile = { path = "crates/paws_profile" }
paws_core = { path = "crates/paws_core" }
paws_vpn = { path = "crates/paws_vpn" }
paws_app = { path = "crates/paws_app" }
paws_engine = { path = "crates/paws_engine" }
paws_engine_meow = { path = "crates/paws_engine_meow" }
paws_engine_go = { path = "crates/paws_engine_go" }

# NSH UI and its matching Ability runtime are built from the local checkout by
# scripts/build-nsh-ohos.sh. This workspace contains the Rust application bridge.
ohos-ashmem-binding = "0.1.0"
ohos-hilog-binding = "0.2.3"
ohos-resource-manager-binding = "0.3.4"

meow-common = { git = "https://github.com/meow-rs/meow-rs", rev = "52d75ec0fe7eefcc427639ed2bb7ea242dc2781f" }
meow-config = { git = "https://github.com/meow-rs/meow-rs", rev = "52d75ec0fe7eefcc427639ed2bb7ea242dc2781f", features = ["anytls", "boring-tls"] }
meow-dns = { git = "https://github.com/meow-rs/meow-rs", rev = "52d75ec0fe7eefcc427639ed2bb7ea242dc2781f", default-features = false }
meow-listener = { git = "https://github.com/meow-rs/meow-rs", rev = "52d75ec0fe7eefcc427639ed2bb7ea242dc2781f" }
meow-proxy = { git = "https://github.com/meow-rs/meow-rs", rev = "52d75ec0fe7eefcc427639ed2bb7ea242dc2781f", features = ["default", "anytls"], default-features = false }
meow-trie = { git = "https://github.com/meow-rs/meow-rs", rev = "52d75ec0fe7eefcc427639ed2bb7ea242dc2781f" }
meow-rules = { git = "https://github.com/meow-rs/meow-rs", rev = "52d75ec0fe7eefcc427639ed2bb7ea242dc2781f" }
meow-transport = { git = "https://github.com/meow-rs/meow-rs", rev = "52d75ec0fe7eefcc427639ed2bb7ea242dc2781f", default-features = false, features = ["simple-obfs"] }
meow-tunnel = { git = "https://github.com/meow-rs/meow-rs", rev = "52d75ec0fe7eefcc427639ed2bb7ea242dc2781f" }

anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
futures = "0.3"
getrandom = "0.2"
ipnet = "2"
libc = "0.2"
maxminddb = { version = "0.27", features = ["mmap"] }
regex = "1"
lwip = { git = "https://github.com/meow-rs/meow-rs", rev = "52d75ec0fe7eefcc427639ed2bb7ea242dc2781f", package = "meow-lwip" }
netstack-smoltcp = "0.2"
napi-build-ohos = "1.2.0"
napi-derive-ohos = "1.2.0"
napi-ohos = { version = "1.2.0", features = ["napi8", "tokio_rt"] }
once_cell = "1"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "http2",
  "cookies",
  "gzip",
  "brotli",
  "json",
  "multipart",
  "stream",
] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
serde_yaml = "0.9"
shadowsocks = { version = "1.24", default-features = false, features = ["aead-cipher", "aead-cipher-2022", "stream-cipher"] }
subtle = "2"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = [
  "full",
  "macros",
  "rt",
  "rt-multi-thread",
  "sync",
  "time",
  "net",
  "fs",
  "io-util",
] }
tokio-tungstenite = { version = "0.29", default-features = false, features = [
  "connect",
  "handshake",
] }
toml = "0.9"
tracing = "0.1"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"

# Native provider decoding and local wire regressions.
hickory-proto = "0.26"
zstd = "0.14"
tempfile = "3"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[workspace.lints.rust]
unused_must_use = "warn"
