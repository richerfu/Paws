[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "1.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.89"

[workspace.dependencies]
paws_model = { path = "crates/paws_model" }
paws_profile = { path = "crates/paws_profile" }
paws_core = { path = "crates/paws_core" }
paws_vpn = { path = "crates/paws_vpn" }

# Arkit main + rebased shadow parity + semantic button surface fixes.
# Declarative `#[entry(plugins = [...])]` bridge-plugin registration.
arkit = { git = "https://github.com/richerfu/arkit.git", rev = "903bccc1a7d611e41186531f64d4a7d4b160b8af", features = ["router", "shadcn", "barcode"] }
ohos-ashmem-binding = "0.1.0"
ohos-fileuri-binding = "0.2.4"
ohos-fileshare-binding = "0.2.4"
ohos-resource-manager-binding = "0.3.4"

# Keep plugin traits on Arkit's exact Ability source and revision. The matching
# ArkTS host is vendored under vendor/openharmony-ability/native_ability.
openharmony-ability-plugin-files = { git = "https://github.com/richerfu/openharmony-ability.git", rev = "2b5defdb0a016b841736470f9c32f2929380c448" }
openharmony-ability-plugin-url = { git = "https://github.com/richerfu/openharmony-ability.git", rev = "2b5defdb0a016b841736470f9c32f2929380c448" }

meow-api = "=0.22.0"
meow-common = "=0.22.0"
meow-config = { version = "=0.22.0", features = ["anytls", "boring-tls"] }
meow-dns = "=0.22.0"
meow-listener = "=0.22.0"
meow-proxy = { version = "=0.22.0", features = ["anytls"] }
meow-trie = "=0.22.0"
meow-tunnel = "=0.22.0"

anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
dashmap = "6"
dioxus = { version = "0.7.10", default-features = false, features = ["signals", "hooks", "macro"] }
futures = "0.3"
getrandom = "0.2"
ipnet = "2"
libc = "0.2"
lwip = { package = "meow-lwip", version = "=0.22.0" }
netstack-smoltcp = "0.2"
napi-build-ohos = "1.2.0"
napi-derive-ohos = "1.2.0"
napi-ohos = { version = "1.2.0", features = ["napi8", "tokio_rt"] }
once_cell = "1"
parking_lot = "0.12"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "cookies", "gzip", "brotli", "json", "multipart", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
shadowsocks = { version = "1.24", default-features = false, features = ["aead-cipher"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake"] }
tracing = "0.1"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3"
url = "2"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[workspace.lints.rust]
unused_must_use = "warn"
